<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="闭环进度看板：投入 / 进度 / 下一步 · 金库事实资金侧栏" />
  <title>项目进度看板 · 闭环</title>
  <link rel="stylesheet" href="assets/style.css?v=20261014b" />
</head>
<body>
  <header class="header">
    <h1>📊 项目进度看板 · 闭环</h1>
    <div class="header-meta" id="header-meta">
      <span class="badge">加载中…</span>
    </div>
  </header>

  <div class="layout">
    <main class="main">
      <div id="status" class="status-msg">正在加载 data/board.json …</div>

      <div class="section-title">看板（列 = 闭环；卡 = 投入 / 进度 / 下一步）</div>
      <div class="kanban" id="kanban" aria-label="闭环看板"></div>

      <div class="section-title">甘特时间线</div>
      <div id="gantt" aria-label="甘特图"></div>
    </main>

    <aside class="sidebar" aria-label="资金">
      <h2>资金（金库事实）</h2>
      <p class="sidebar-hint">
        仅显示主库可核验数字；未知为「待核验」，不显示示例或虚构余额。
      </p>
      <div class="money-total" id="money-total"></div>
      <div id="money-cash"></div>
      <div id="money-liabilities"></div>
      <div class="section-title-sm">分闭环余额</div>
      <div id="money-list"></div>
      <div class="shortfall-list" id="shortfall-list"></div>
      <div id="money-info" class="money-info"></div>
    </aside>
  </div>

  <script src="assets/app.js?v=20261014b"></script>
</body>
</html>
