name: Sync board.json from GitHub

on:
  schedule:
    # Every day at 02:00 UTC ≈ 10:00 CST
    - cron: "0 2 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run sync script
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/sync-from-github.mjs

      - name: Commit updated board.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/board.json
          if git diff --staged --quiet; then
            echo "No changes to board.json"
          else
            git commit -m "chore: sync board.json from GitHub metadata [skip ci]"
            git push
          fi
